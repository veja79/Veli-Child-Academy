# Netlify: builds the React site from the frontend folder
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for page addresses like /register
# (Cloudflare does the same via not_found_handling in frontend/wrangler.jsonc)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
