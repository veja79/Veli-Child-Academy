# Netlify: builds the React site from the frontend folder
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Spring Boot backend on Railway (news, contact messages, admin login)
  VITE_API_BASE = "https://veli-child-academy-production.up.railway.app/api"
