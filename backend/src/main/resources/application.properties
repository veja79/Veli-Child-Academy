spring.application.name=veli-child-academy-api
server.port=8080

# Database (override with environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veli_academy}
spring.datasource.username=${DB_USERNAME:veli}
spring.datasource.password=${DB_PASSWORD:veli}

# Flyway owns the schema; Hibernate does not change tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# JWT signing secret: at least 32 characters, required
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}

# First admin account, created on startup only if no admin exists yet
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
