name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Docker image builds
        run: docker build -t veli-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Check site address and SEO files
        run: |
          SITE=https://www.velichildacademy.workers.dev
          grep -q "$SITE" dist/index.html
          ! grep -q "%VITE_SITE_URL%" dist/index.html
          grep -q "<loc>$SITE/register</loc>" dist/sitemap.xml
          grep -q "Sitemap: $SITE/sitemap.xml" dist/robots.txt
          grep -q "up.railway.app/api" dist/assets/*.js
          test ! -f dist/_redirects  # Cloudflare rejects the Netlify-style SPA rule
      - name: Build still correct if the host ignores .env files
        run: |
          mv .env.production /tmp/env.production
          npm run build
          ! grep -q "%VITE_SITE_URL%" dist/index.html
          grep -q "workers.dev" dist/index.html
          grep -q "up.railway.app/api" dist/assets/*.js
          mv /tmp/env.production .env.production
