name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Docker image builds
        run: docker build -t veli-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Check site address and SEO files
        run: |
          grep -q "veli-child-academy.pages.dev" dist/index.html
          ! grep -q "%VITE_SITE_URL%" dist/index.html
          grep -q "<loc>https://veli-child-academy.pages.dev/register</loc>" dist/sitemap.xml
          grep -q "Sitemap: https://veli-child-academy.pages.dev/sitemap.xml" dist/robots.txt
          grep -q "up.railway.app/api" dist/assets/*.js
