# Local MySQL for development: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: veli-mysql
    environment:
      MYSQL_DATABASE: veli_academy
      MYSQL_USER: veli
      MYSQL_PASSWORD: veli
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - veli-mysql-data:/var/lib/mysql

volumes:
  veli-mysql-data:
